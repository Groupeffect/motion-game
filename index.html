<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Steady Hands</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0d1117;
      font-family: 'Segoe UI', sans-serif;
      touch-action: none;
      color: #fff;
    }
    #startScreen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0d1117; z-index: 10;
    }
    #startScreen h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    #startScreen p { color: #8b949e; margin-bottom: 2rem; text-align: center; padding: 0 1.5rem; line-height: 1.6; }
    #startBtn {
      padding: 1rem 3rem; font-size: 1.3rem;
      background: #238636; color: #fff;
      border: none; border-radius: 50px;
      cursor: pointer; transition: transform 0.2s;
    }
    #startBtn:active { transform: scale(0.95); }

    #gameArea {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
    }

    /* Lebensbalken */
    #hpBarContainer {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      width: 80%; max-width: 300px;
      height: 24px;
      background: #21262d;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #30363d;
    }
    #hpBar {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #f85149, #238636);
      border-radius: 10px;
      transition: width 0.1s linear;
    }
    #hpText {
      position: fixed; top: 48px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem; color: #8b949e;
    }

    /* Countdown */
    #countdown {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(13,17,23,0.9); z-index: 5;
      font-size: 5rem; font-weight: bold;
    }

    /* Game Over */
    #gameOver {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85); z-index: 10;
    }
    #gameOver h2 { color: #f85149; font-size: 2.5rem; margin-bottom: 0.5rem; }
    #gameOver p { color: #8b949e; font-size: 1.1rem; margin-bottom: 2rem; }
    #restartBtn {
      padding: 0.8rem 2.5rem; font-size: 1.1rem;
      background: #238636; color: #fff;
      border: none; border-radius: 50px; cursor: pointer;
    }

    #sensorWarning {
      position: fixed; bottom: 15px; left: 50%;
      transform: translateX(-50%);
      color: #f85149; font-size: 0.85rem;
      background: rgba(0,0,0,0.7); padding: 0.5rem 1rem;
      border-radius: 8px; z-index: 20; display: none;
    }

    /* Visuelle Feedback-Fläche */
    #feedback {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 2;
      transition: box-shadow 0.1s;
    }
  </style>
</head>
<body>

<div id="startScreen">
  <h1>🤲 Steady Hands</h1>
  <p>Halte dein Handy so ruhig wie möglich!<br>
     Neigung & Erschütterung kosten Leben.<br>
     Leben regeneriert sich langsam.<br>
     Wer hält am längsten?</p>
  <button id="startBtn">▶ Start</button>
</div>

<div id="gameArea">
  <div id="hpBarContainer"><div id="hpBar"></div></div>
  <div id="hpText">100 / 100</div>
</div>

<div id="countdown"></div>
<div id="feedback"></div>

<div id="gameOver">
  <h2>💀 Game Over</h2>
  <p>Dauer: <span id="survivalTime">0</span> s</p>
  <button id="restartBtn">Nochmal</button>
</div>

<div id="sensorWarning">⚠️ Kein Sensor-Empfang – Berechtigung prüfen</div>

<script>
const startScreen = document.getElementById('startScreen');
const gameArea = document.getElementById('gameArea');
const countdownEl = document.getElementById('countdown');
const gameOverScreen = document.getElementById('gameOver');
const hpBar = document.getElementById('hpBar');
const hpText = document.getElementById('hpText');
const survivalTimeEl = document.getElementById('survivalTime');
const sensorWarning = document.getElementById('sensorWarning');
const feedback = document.getElementById('feedback');

let running = false;
let hp = 100;
let baseX = 0;
let baseY = 0;
let startTime = 0;
let gotMotionData = false;
let sensorListenerInstalled = false;

let lastAcc = {
  x: null,
  y: null,
  z: null
};

// Audio
let audioCtx = null;

function initAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  } catch (e) {
    console.warn('Audio nicht verfügbar:', e);
  }
}

function playBeep(freq, duration, type = 'sine', volume = 0.5) {
  if (!audioCtx) return;

  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = volume;

    gain.gain.exponentialRampToValueAtTime(
      0.01,
      audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playCountdownBeep() {
  playBeep(800, 0.2, 'sine', 0.6);
}

function playGoBeep() {
  playBeep(1200, 0.4, 'sine', 0.7);
}

function playDamageSound(intensity) {
  const vol = Math.min(0.4, intensity * 0.1);
  playBeep(150 + Math.random() * 100, 0.1, 'sawtooth', vol);
}

function playDeathAlarm() {
  if (!audioCtx) return;

  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'square';
    osc.frequency.value = 440;
    gain.gain.value = 0.5;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 3);
  } catch (e) {}
}


// ============================================================
// SENSOR
// ============================================================

function processMotionEvent(e) {
  const acc =
    e.accelerationIncludingGravity ||
    e.acceleration;

  if (!acc) return;

  const x = acc.x;
  const y = acc.y;
  const z = acc.z;

  if (
    typeof x !== 'number' ||
    typeof y !== 'number' ||
    !Number.isFinite(x) ||
    !Number.isFinite(y)
  ) {
    return;
  }

  // Sensor funktioniert
  gotMotionData = true;
  sensorWarning.style.display = 'none';

  // Letzten Wert speichern
  lastAcc.x = x;
  lastAcc.y = y;
  lastAcc.z = typeof z === 'number' ? z : null;

  if (!running) return;

  const dx = x - baseX;
  const dy = y - baseY;

  const deviation = Math.sqrt(
    dx * dx +
    dy * dy
  );

  // Schaden
  const damage = deviation * 0.15;

  if (damage > 0.05) {
    hp -= damage;

    if (Math.random() < 0.3) {
      playDamageSound(deviation);
    }

    const alpha = Math.min(
      0.4,
      deviation * 0.05
    );

    feedback.style.boxShadow =
      `inset 0 0 ${deviation * 10}px rgba(248,81,73,${alpha})`;
  } else {
    feedback.style.boxShadow = 'none';
  }

  // Regeneration
  hp += 0.033;

  hp = Math.max(
    0,
    Math.min(100, hp)
  );

  hpBar.style.width = hp + '%';
  hpText.textContent =
    Math.ceil(hp) + ' / 100';

  if (hp > 60) {
    hpBar.style.background =
      'linear-gradient(90deg, #238636, #2ea043)';
  } else if (hp > 30) {
    hpBar.style.background =
      'linear-gradient(90deg, #d29922, #f0883e)';
  } else {
    hpBar.style.background =
      'linear-gradient(90deg, #f85149, #da3633)';
  }

  if (hp <= 0) {
    endGame();
  }
}


// Sensorlistener nur EINMAL installieren
function installMotionListener() {
  if (sensorListenerInstalled) return;

  sensorListenerInstalled = true;

  window.addEventListener(
    'devicemotion',
    processMotionEvent,
    { passive: true }
  );
}


// ============================================================
// BERECHTIGUNG
// ============================================================

async function requestMotionPermission() {

  // Kein DeviceMotionEvent
  if (typeof DeviceMotionEvent === 'undefined') {
    return {
      success: false,
      reason: 'unsupported'
    };
  }

  /*
   * iOS / Safari:
   * requestPermission() existiert nur bei bestimmten
   * iOS-Versionen und muss aus einem Benutzerklick
   * heraus aufgerufen werden.
   */
  if (
    typeof DeviceMotionEvent.requestPermission === 'function'
  ) {
    try {
      const permission =
        await DeviceMotionEvent.requestPermission();

      if (permission === 'granted') {
        return {
          success: true,
          reason: 'granted'
        };
      }

      return {
        success: false,
        reason: 'denied'
      };

    } catch (error) {
      console.warn(
        'Motion-Berechtigung:',
        error
      );

      return {
        success: false,
        reason: 'error'
      };
    }
  }

  /*
   * Android Chrome / Firefox / andere Browser:
   *
   * Dort gibt es normalerweise keinen
   * requestPermission()-Dialog für DeviceMotion.
   *
   * Der Browser entscheidet über die Website-
   * Berechtigung bzw. Permissions Policy.
   */
  return {
    success: true,
    reason: 'browser-managed'
  };
}


// ============================================================
// SENSORTEST
// ============================================================

function waitForSensor(timeout = 5000) {

  return new Promise(resolve => {

    // Falls bereits Daten vorhanden sind
    if (gotMotionData) {
      resolve(true);
      return;
    }

    const start = Date.now();

    const check = setInterval(() => {

      if (gotMotionData) {
        clearInterval(check);
        resolve(true);
        return;
      }

      if (Date.now() - start >= timeout) {
        clearInterval(check);
        resolve(false);
      }

    }, 100);

  });
}


// ============================================================
// SPIEL
// ============================================================

let animFrame = null;

function gameLoop() {
  if (!running) return;

  animFrame =
    requestAnimationFrame(gameLoop);
}

function endGame() {

  running = false;

  if (animFrame) {
    cancelAnimationFrame(animFrame);
  }

  const seconds =
    ((Date.now() - startTime) / 1000)
    .toFixed(1);

  survivalTimeEl.textContent =
    seconds;

  playDeathAlarm();

  setTimeout(() => {
    gameOverScreen.style.display =
      'flex';
  }, 3000);
}


async function startGame() {

  initAudio();

  /*
   * Listener VOR der Berechtigungsanfrage installieren.
   * Dadurch verpassen wir keine ersten Sensorwerte.
   */
  installMotionListener();

  gotMotionData = false;

  // iOS Permission
  const permission =
    await requestMotionPermission();

  if (!permission.success) {

    if (permission.reason === 'denied') {
      alert(
        'Der Zugriff auf den Bewegungssensor wurde verweigert. ' +
        'Bitte erlaube Bewegung & Orientierung für diese Website.'
      );
    } else if (permission.reason === 'unsupported') {
      alert(
        'Dieser Browser unterstützt keine Bewegungssensoren.'
      );
    } else {
      alert(
        'Der Bewegungssensor konnte nicht aktiviert werden.'
      );
    }

    return;
  }


  /*
   * Kurz prüfen, ob tatsächlich Daten ankommen.
   */
  const sensorAvailable =
    await waitForSensor(5000);

  if (!sensorAvailable) {

    sensorWarning.style.display =
      'block';

    sensorWarning.textContent =
      '⚠️ Keine Sensordaten. Prüfe die Browser-Berechtigung für Bewegungssensoren.';

    /*
     * Nicht abbrechen.
     *
     * Manche Browser liefern die ersten
     * Sensordaten verzögert.
     */
  }


  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';
  gameArea.style.display = 'flex';


  // Countdown
  countdownEl.style.display = 'flex';

  let count = 3;

  countdownEl.textContent = count;

  playCountdownBeep();


  const countInterval =
    setInterval(() => {

      count--;

      if (count > 0) {

        countdownEl.textContent =
          count;

        playCountdownBeep();

      } else if (count === 0) {

        countdownEl.textContent =
          'GO!';

        playGoBeep();

      } else {

        clearInterval(countInterval);

        countdownEl.style.display =
          'none';


        /*
         * Nullpunkt setzen.
         *
         * Falls der Sensor noch keinen Wert
         * geliefert hat, nicht mit 0 rechnen.
         */
        if (
          lastAcc.x !== null &&
          lastAcc.y !== null
        ) {
          baseX = lastAcc.x;
          baseY = lastAcc.y;
        }

        hp = 100;

        hpBar.style.width = '100%';
        hpText.textContent = '100 / 100';

        startTime = Date.now();

        running = true;

        gameLoop();


        /*
         * Nur warnen, wenn nach dem Start
         * weiterhin keine Daten eintreffen.
         */
        setTimeout(() => {

          if (
            !gotMotionData &&
            running
          ) {

            sensorWarning.style.display =
              'block';

            sensorWarning.textContent =
              '⚠️ Keine Sensordaten vom Bewegungssensor.';
          }

        }, 3000);
      }

    }, 1000);
}


// ============================================================
// BUTTONS
// ============================================================

document
  .getElementById('startBtn')
  .addEventListener(
    'click',
    startGame
  );

document
  .getElementById('restartBtn')
  .addEventListener(
    'click',
    () => {

      gameOverScreen.style.display =
        'none';

      startGame();
    }
  );


// Sensorlistener bereits beim Laden
// registrieren.
installMotionListener();

</script>
